name: Build and test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Gm1KonverterCrossPlatform.sln --configuration Release
      - name: Test
        run: dotnet test Gm1KonverterCrossPlatform.Tests --configuration Release --no-build --verbosity normal
